name: Daily news roundup

on:
  schedule:
    # 05:00 UTC = 5am in winter, 6am in summer, so stories are ready by 6am UK time all year.
    - cron: "0 5 * * *"
  workflow_dispatch: # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch today's stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-news.mjs
      - name: Publish news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Daily roundup $(date -u +%Y-%m-%d)"
          git push
